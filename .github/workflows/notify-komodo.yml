name: Notify Komodo

# Trigger the Komodo "check updates" procedure only after a production image
# build has finished successfully on main. Komodo's listener only understands
# push payloads, so we send a signed synthetic push for the branch it listens on.
on:
  workflow_run:
    workflows:
      - "Publish fetchtime image for production"
      - "Publish ML API image for production"
      - "Publish NextJS image for production"
      - "Publish Autogluon image for production"
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Trigger Komodo procedure after build
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
          KOMODO_URL: https://komodolistener.simonottosen.dk/listener/github/procedure/693fd5dcc2eba082390a72e1/main
        run: |
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | awk '{print $NF}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$KOMODO_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$sig" \
            --data "$body")
          echo "Komodo listener responded: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Komodo listener returned $code (non-fatal)"
          fi
