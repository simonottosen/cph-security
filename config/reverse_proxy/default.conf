# Docker's embedded DNS. Backend names are resolved per request (through the
# variables below) instead of once at startup. Two failure modes this avoids:
#
#   1. Recreating a backend gives it a new IP. With names baked into an
#      `upstream` block, nginx keeps dialling the dead address until it is
#      restarted -- so every redeploy silently broke the frontend.
#   2. nginx refuses to start at all when a name in an `upstream` block does not
#      resolve, so one stopped backend could take down the whole proxy.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # No fallback backend here, deliberately. A stale second frontend used to be
    # wired in as `backup`, so a Next.js outage served a months-old app instead
    # of an error: users saw wrong data and nothing alerted. Fail visibly.
    location / {
        set $frontend "cph_frontend_nextjs:3000";
        proxy_pass http://$frontend$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        set $gateway "apisix:9080";
        proxy_pass http://$gateway$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
