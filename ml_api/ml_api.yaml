apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-api-models
spec:
  # ReadWriteMany so every serving replica can read the model while the training
  # CronJob writes it. Requires a storage class that supports RWX (e.g. NFS). If
  # your cluster only offers ReadWriteOnce, set replicas: 1 on the Deployment.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api-deployment
spec:
  selector:
    matchLabels:
      app: ml-api
  replicas: 3 # serving replicas; they only read the shared model artifact
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
      - name: ml-api
        image: ghcr.io/simonottosen/cph-security_ml_api:arm64-latest
        ports:
        - containerPort: 5000
        imagePullPolicy: "Always"
        env:
        - name: CPHAPI_HOST
          value: "https://cphapi.simonottosen.dk"
        - name: MODELS_DIR
          value: "/models"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ml-api-models

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-api-trainer
spec:
  # Retrain daily out-of-process; the serving pods hot-reload the new artifact.
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: trainer
            image: ghcr.io/simonottosen/cph-security_ml_api:arm64-latest
            imagePullPolicy: "Always"
            command: ["python", "/project/train.py"]
            env:
            - name: CPHAPI_HOST
              value: "https://cphapi.simonottosen.dk"
            - name: MODELS_DIR
              value: "/models"
            volumeMounts:
            - name: models
              mountPath: /models
          volumes:
          - name: models
            persistentVolumeClaim:
              claimName: ml-api-models

---
kind: Service
apiVersion: v1
metadata:
  name: ml-api
  labels:
    app: ml-api
spec:
  selector:
    app: ml-api
  ports:
  - port: 80
    protocol: TCP
    targetPort: 5000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-api
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ml-api
            port:
              number: 80
